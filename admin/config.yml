# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: laboutiquecatydog/laboutiquecatydog.github.io
  branch: main
  base_url: https://sveltia-cms-auth.laboutiquecatydog10.workers.dev
  site_domain: laboutiquecatydog.github.io

site_url: https://laboutiquecatydog.github.io

media_folder: /assets/img/managed
public_folder: /assets/img/managed

collections:
  - name: sitio
    label: Sitio
    label_singular: Dato del sitio
    description: Marca, datos del local, redes sociales, menú y pie de página.
    icon: settings
    editor:
      preview: false
    files:
      - name: global
        label: Datos del sitio
        file: data/sitio.json
        preview_path: /
        fields:
          - name: marca
            label: Marca
            widget: object
            fields:
              - { name: logo, label: Logo, widget: image }
              - { name: logoAlt, label: Texto alternativo del logo, widget: string, required: false, default: '', hint: 'Describe la imagen si no carga. Ej.: Logotipo de La Boutique Cat & Dog' }
              - { name: nombre, label: Nombre principal, widget: string, required: false, default: '', hint: 'Ej.: La Boutique' }
              - { name: nombreSecundario, label: Nombre secundario, widget: string, required: false, default: '', hint: 'Ej.: Cat & Dog' }
              - { name: ariaLabel, label: 'Etiqueta del enlace de inicio', widget: string, required: false, default: '', hint: 'La que leen los lectores de pantalla al hacer clic en el logo.' }

          - name: negocio
            label: Datos del local
            widget: object
            fields:
              - { name: whatsapp, label: 'WhatsApp (sólo números)', widget: string, required: false, default: '', hint: 'Con código de país, sin signos. Ej.: 543874578676' }
              - { name: whatsappDisplay, label: 'WhatsApp (como se muestra)', widget: string, required: false, default: '', hint: 'Ej.: +54 9 387 457-8676' }
              - { name: whatsappMensaje, label: Mensaje inicial de WhatsApp, widget: text, required: false, default: '' }
              - { name: phone, label: 'Teléfono (opcional)', widget: string, required: false, default: '', hint: 'Si queda vacío no se muestra en la web.' }
              - { name: email, label: Correo electrónico, widget: string, required: false, default: '' }
              - { name: address, label: Dirección, widget: string, required: false, default: '' }
              - { name: hours, label: Horarios, widget: string, required: false, default: '' }
              - { name: mapsQuery, label: Ubicación para el mapa, widget: string, required: false, default: '', hint: 'Coordenadas (lat,lng) o una dirección para buscar en Google Maps.' }
              - { name: carouselDelay, label: 'Demora del carrusel (milisegundos)', widget: number, required: false, hint: '3000 = 3 segundos.' }

          - name: redes
            label: Redes sociales
            widget: object
            fields:
              - name: instagram
                label: Instagram
                widget: object
                fields:
                  - { name: url, label: Enlace, widget: string, required: false, default: '' }
                  - { name: etiqueta, label: Nombre para mostrar, widget: string, required: false, default: '' }
              - name: tiktok
                label: TikTok
                widget: object
                fields:
                  - { name: url, label: Enlace, widget: string, required: false, default: '' }
                  - { name: etiqueta, label: Nombre para mostrar, widget: string, required: false, default: '' }
              - name: facebook
                label: Facebook
                widget: object
                fields:
                  - { name: url, label: Enlace, widget: string, required: false, default: '' }
                  - { name: etiqueta, label: Nombre para mostrar, widget: string, required: false, default: '' }

          - name: nav
            label: Menú superior
            widget: list
            summary: '{{texto}}'
            fields:
              - { name: texto, label: Texto, widget: string, required: false, default: '' }
              - { name: ancla, label: 'Enlace', widget: string, required: false, default: '', hint: 'Sección de la misma página. Ej.: #productos' }

          - { name: navCtaTexto, label: 'Texto del botón del menú', widget: string, required: false, default: '', hint: 'Aparece a la derecha del menú. Ej.: WhatsApp' }

          - name: footer
            label: Pie de página
            widget: object
            fields:
              - { name: descripcion, label: Descripción, widget: text, required: false, default: '' }
              - { name: seccionesTitulo, label: 'Título de la columna de secciones', widget: string, required: false, default: '' }
              - { name: contactoTitulo, label: 'Título de la columna de contacto', widget: string, required: false, default: '' }
              - { name: seguinosTitulo, label: 'Título de la columna de redes', widget: string, required: false, default: '' }
              - name: ordenSocial
                label: 'Orden de las redes'
                widget: list
                required: false
                hint: 'En qué orden aparecen en el pie. Opciones válidas: instagram, tiktok, facebook.'
              - { name: whatsappTexto, label: 'Texto del enlace de WhatsApp', widget: string, required: false, default: '' }
              - { name: copyright, label: Copyright, widget: string, required: false, default: '' }

  - name: pagina
    label: Página
    label_singular: Sección
    description: Secciones que se ven en la portada, en orden.
    icon: web
    editor:
      preview: false
    files:
      - name: home
        label: Secciones de la página
        file: data/pagina.json
        preview_path: /
        fields:
          - name: secciones
            label: Secciones
            widget: list
            typeKey: tipo
            summary: '{{titulo}}'
            hint: 'El orden de esta lista es el orden en que se ven en la web. Cada sección elige su tipo con el selector.'
            types:
              - name: hero
                label: Portada con fotos
                description: Título principal, botones y carrusel de imágenes.
                fields:
                  - &huella
                    name: huella
                    label: Huella decorativa
                    widget: select
                    required: false
                    hint: 'Marca de agua de patitas detrás de la sección.'
                    options:
                      - { label: Izquierda, value: izquierda }
                      - { label: Derecha, value: derecha }
                      - { label: Ninguna, value: ninguna }
                  - &seccionId
                    name: id
                    label: 'Identificador (ancla)'
                    widget: string
                    required: false
                    default: ''
                    hint: 'Para enlazar desde el menú. Ej.: inicio'
                  - { name: aria, label: 'Etiqueta accesible', widget: string, required: false, default: '' }
                  - { name: eyebrow, label: 'Texto pequeño superior', widget: string, required: false, default: '' }
                  - { name: titulo, label: Título, widget: string, required: false, default: '', hint: 'Se puede marcar en negrita con **palabra**.' }
                  - { name: texto, label: Texto, widget: text, required: false, default: '' }
                  - name: botonPrincipal
                    label: Botón principal
                    widget: object
                    fields:
                      - { name: texto, label: Texto, widget: string, required: false, default: '' }
                      - { name: mensaje, label: 'Mensaje de WhatsApp', widget: text, required: false, default: '' }
                  - name: botonSecundario
                    label: Botón secundario
                    widget: object
                    fields:
                      - { name: texto, label: Texto, widget: string, required: false, default: '' }
                      - { name: enlace, label: 'Enlace', widget: string, required: false, default: '', hint: 'Ej.: #productos' }
                  - { name: carruselAria, label: 'Etiqueta accesible del carrusel', widget: string, required: false, default: '' }
                  - name: slides
                    label: Fotos del carrusel
                    widget: list
                    summary: '{{alt}}'
                    fields:
                      - { name: imagen, label: Foto, widget: image }
                      - { name: alt, label: 'Texto alternativo', widget: string, required: false, default: '', hint: 'Describe la foto para quienes no pueden verla.' }
                      - { name: srcset, widget: hidden, default: '' }
                      - { name: sizes, widget: hidden, default: '' }
                      - { name: ancho, widget: hidden, default: '' }
                      - { name: alto, widget: hidden, default: '' }
                      - { name: prioridad, widget: hidden, default: false }

              - name: categorias
                label: Categorías (Perros y Gatos)
                description: Dos tarjetas con foto para elegir a quién se busca.
                fields:
                  - *huella
                  - *seccionId
                  - { name: eyebrow, label: 'Texto pequeño superior', widget: string, required: false, default: '' }
                  - { name: titulo, label: Título, widget: string, required: false, default: '' }
                  - { name: intro, label: Texto de entrada, widget: text, required: false, default: '' }
                  - { name: ctaTexto, label: 'Texto del enlace', widget: string, required: false, default: '' }
                  - name: tarjetas
                    label: Tarjetas
                    widget: list
                    summary: '{{titulo}}'
                    fields:
                      - { name: imagen, label: Foto, widget: image }
                      - { name: alt, label: 'Texto alternativo', widget: string, required: false, default: '' }
                      - { name: ancho, widget: hidden, default: '' }
                      - { name: alto, widget: hidden, default: '' }
                      - { name: titulo, label: Título, widget: string, required: false, default: '' }
                      - { name: texto, label: Texto, widget: text, required: false, default: '' }
                      - { name: enlace, label: 'Enlace', widget: string, required: false, default: '', hint: 'Ej.: #productos' }

              - name: productos
                label: Productos
                description: Lista de productos con filtros por mascota.
                fields:
                  - *huella
                  - *seccionId
                  - { name: eyebrow, label: 'Texto pequeño superior', widget: string, required: false, default: '' }
                  - { name: titulo, label: Título, widget: string, required: false, default: '' }
                  - { name: intro, label: Texto de entrada, widget: text, required: false, default: '' }
                  - { name: mostrarFiltros, label: 'Mostrar filtros (Todos / Perros / Gatos)', widget: boolean, required: false }
                  - { name: ctaTexto, label: 'Texto del botón', widget: string, required: false, default: '' }
                  - name: productos
                    label: Tarjetas de producto
                    widget: list
                    summary: '{{titulo}}'
                    fields:
                      - { name: etiqueta, label: Etiqueta, widget: string, required: false, default: '', hint: 'Texto chico que aparece arriba del título. Ej.: Descanso' }
                      - { name: titulo, label: Título, widget: string, required: false, default: '' }
                      - { name: descripcion, label: Descripción, widget: text, required: false, default: '' }
                      - { name: mascotas, label: 'Para quién es', widget: string, required: false, default: '', hint: 'Escribí: perro, gato, o perro gato (separado por un espacio).' }
                      - { name: precio, label: Precio (opcional), widget: string, required: false, default: '', hint: 'Texto libre. Podés dejarlo vacío: en ese caso no se muestra el precio en la web.' }
                      - { name: mensajeWhatsApp, label: 'Mensaje de WhatsApp', widget: text, required: false, default: '' }
                      - name: fotos
                        label: Fotos
                        widget: list
                        summary: '{{alt}}'
                        fields:
                          - { name: foto, label: Foto, widget: image }
                          - { name: alt, label: 'Texto alternativo', widget: string, required: false, default: '' }

              - name: imagenTexto
                label: Imagen y texto
                description: Foto a un lado y texto al otro. Se usa en "Nosotros".
                fields:
                  - *huella
                  - *seccionId
                  - { name: eyebrow, label: 'Texto pequeño superior', widget: string, required: false, default: '' }
                  - { name: titulo, label: Título, widget: string, required: false, default: '' }
                  - { name: texto, label: Texto, widget: text, required: false, default: '' }
                  - name: vinetas
                    label: Puntos destacados
                    widget: list
                    required: false
                    hint: 'Lista corta de ideas, una por fila.'
                  - { name: imagen, label: Foto, widget: image }
                  - { name: imagenAlt, label: 'Texto alternativo de la foto', widget: string, required: false, default: '' }
                  - { name: imagenAncho, widget: hidden, default: '' }
                  - { name: imagenAlto, widget: hidden, default: '' }
                  - name: boton
                    label: Botón
                    widget: object
                    fields:
                      - { name: texto, label: Texto, widget: string, required: false, default: '' }
                      - { name: mensaje, label: 'Mensaje de WhatsApp', widget: text, required: false, default: '' }

              - name: contacto
                label: Contacto
                description: Datos de contacto, WhatsApp y redes.
                fields:
                  - *huella
                  - *seccionId
                  - { name: eyebrow, label: 'Texto pequeño superior', widget: string, required: false, default: '' }
                  - { name: titulo, label: Título, widget: string, required: false, default: '' }
                  - { name: intro, label: Texto de entrada, widget: text, required: false, default: '' }
                  - name: botonWhatsapp
                    label: Botón de WhatsApp
                    widget: object
                    fields:
                      - { name: texto, label: Texto, widget: string, required: false, default: '' }
                      - { name: mensaje, label: 'Mensaje de WhatsApp', widget: text, required: false, default: '' }
                  - { name: botonMapsTexto, label: 'Texto del botón del mapa', widget: string, required: false, default: '' }
                  - name: ordenSocial
                    label: 'Orden de las redes'
                    widget: list
                    required: false
                    hint: 'En qué orden aparecen. Opciones válidas: instagram, tiktok, facebook.'
